name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # 또는 master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        # 저장소에 등록한 Variables를 빌드 타임 환경변수로 주입합니다.
        env:
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
        run: npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Vite 빌드 결과물 폴더
          branch: gh-pages